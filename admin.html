<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#09150f">
<title>Sales Incentive Portal - Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #09150f;
  --surface: #0f2018;
  --surface2: #142a20;
  --line: rgba(180, 230, 205, .08);
  --line2: rgba(180, 230, 205, .17);
  --text: #e8f2ec;
  --muted: #86a496;
  --dim: #5c7a6a;
  --accent: #52e6a6;
  --accent2: #2fc488;
  --ink: #04140c;
  --gold: #f2c35b;
  --warn: #f2c35b;
  --danger: #ff7a7a;
  --info: #6db3ff;
  --violet: #b59cff;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input, select { font-family: inherit; }
::selection { background: rgba(82, 230, 166, .3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bg {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(70% 45% at 10% -5%, rgba(82, 230, 166, .10), transparent 60%),
    radial-gradient(60% 40% at 100% 105%, rgba(242, 195, 91, .05), transparent 60%);
}

.hidden { display: none !important; }
[data-icon] { display: inline-flex; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 15px 18px; border: 0; border-radius: 14px;
  font-size: 15px; font-weight: 700; color: var(--ink);
  background: linear-gradient(180deg, var(--accent), var(--accent2));
  box-shadow: 0 10px 26px -12px rgba(82, 230, 166, .7), inset 0 1px 0 rgba(255,255,255,.35);
  cursor: pointer; text-decoration: none;
  transition: transform .2s var(--ease), filter .2s;
}
.btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; filter: none; }
.btn.ghost { background: rgba(255,255,255,.06); color: var(--text); box-shadow: none; border: 1px solid var(--line2); }
.btn.danger { background: linear-gradient(180deg, #ff8d8d, #ec5f5f); color: #2a0707; box-shadow: 0 10px 26px -12px rgba(255,122,122,.7); }
.spin {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid currentColor; border-right-color: transparent;
  animation: spin .7s linear infinite;
}
.icon-btn {
  width: 42px; height: 42px; display: grid; place-items: center; padding: 0; flex: none;
  border-radius: 13px; border: 1px solid var(--line2); background: rgba(255,255,255,.04);
  color: var(--text); cursor: pointer; transition: background .2s, transform .2s var(--ease);
}
.icon-btn:hover { background: rgba(255,255,255,.09); }
.icon-btn:active { transform: scale(.92); }
.icon-btn.spinning svg { animation: spin .8s linear infinite; }

/* ---------- fields ---------- */
.field { position: relative; margin-top: 14px; }
.field input {
  width: 100%; height: 58px; padding: 24px 16px 6px;
  border-radius: 14px; border: 1px solid var(--line2);
  background: rgba(255,255,255,.035); color: var(--text);
  font-size: 16px; font-weight: 500; outline: none; color-scheme: dark;
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.field input:focus {
  border-color: var(--accent); background: rgba(82,230,166,.05);
  box-shadow: 0 0 0 4px rgba(82,230,166,.12);
}
.field label {
  position: absolute; left: 16px; top: 19px; color: var(--muted); font-size: 15px;
  pointer-events: none; transition: all .2s var(--ease);
}
.field input:focus + label,
.field input:not(:placeholder-shown) + label { top: 9px; font-size: 11.5px; color: var(--accent); }
.field .eye {
  position: absolute; right: 8px; top: 9px; width: 40px; height: 40px;
  display: grid; place-items: center; border: 0; background: transparent;
  color: var(--muted); border-radius: 10px; cursor: pointer;
}
.field.has-eye input { padding-right: 54px; }
.shake { animation: shake .4s; }

.search { position: relative; }
.search input {
  width: 100%; height: 52px; padding: 0 16px 0 46px; border-radius: 16px;
  border: 1px solid var(--line2); background: rgba(255,255,255,.035); color: var(--text);
  font-size: 15.5px; outline: none; transition: border-color .2s, box-shadow .2s;
}
.search input::placeholder { color: var(--dim); }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(82,230,166,.12); }
.search > span { position: absolute; left: 15px; top: 15px; color: var(--muted); }

.seg {
  position: relative; display: grid; grid-template-columns: repeat(var(--n, 2), 1fr);
  padding: 4px; background: rgba(255,255,255,.04); border-radius: 14px; border: 1px solid var(--line);
}
.seg button {
  position: relative; z-index: 1; padding: 11px; border: 0; background: transparent;
  color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; transition: color .3s;
}
.seg button.on { color: var(--ink); }
.seg-ind {
  position: absolute; top: 4px; bottom: 4px; left: 4px;
  width: calc((100% - 8px) / var(--n, 2)); border-radius: 11px;
  background: linear-gradient(180deg, var(--accent), var(--accent2));
  transform: translateX(calc(var(--i, 0) * 100%));
  transition: transform .45s var(--ease);
}

/* ---------- cards / chips ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px; }
.msg { min-height: 18px; font-size: 13px; margin-top: 12px; color: var(--muted); line-height: 1.4; }
.msg.err { color: var(--danger); }

.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px;
  border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
}
.c-ok { background: rgba(82,230,166,.12); color: var(--accent); }
.c-warn { background: rgba(242,195,91,.13); color: var(--warn); }
.c-bad { background: rgba(255,122,122,.12); color: var(--danger); }
.c-mute { background: rgba(255,255,255,.06); color: var(--muted); }
.c-vio { background: rgba(181,156,255,.13); color: var(--violet); }

.fchip {
  flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line2);
  background: rgba(255,255,255,.03); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer;
  transition: background .25s var(--ease), color .25s, border-color .25s, transform .2s var(--ease);
}
.fchip.on { background: rgba(82,230,166,.14); border-color: rgba(82,230,166,.5); color: var(--accent); }
.fchip:active { transform: scale(.95); }
.fchip i { font-style: normal; opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }

/* ---------- auth ---------- */
.auth { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.auth-wrap { width: 100%; max-width: 400px; }
.brand { text-align: center; margin-bottom: 24px; }
.logo {
  width: 62px; height: 62px; margin: 0 auto 16px; border-radius: 20px; display: grid; place-items: center;
  background: linear-gradient(180deg, var(--accent), var(--accent2)); color: var(--ink);
  box-shadow: 0 16px 40px -14px rgba(82,230,166,.7);
}
.brand h1 { font-family: var(--display); font-size: 28px; font-weight: 700; letter-spacing: -.03em; }
.brand p { color: var(--muted); margin-top: 6px; font-size: 14.5px; }

/* ---------- shell ---------- */
.topbar {
  position: sticky; top: 0; z-index: 15; display: flex; justify-content: space-between; align-items: center;
  padding: 12px 18px; padding-top: calc(12px + env(safe-area-inset-top));
  background: rgba(9,21,15,.78); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}
.tb-l { display: flex; align-items: center; gap: 12px; }
.tb-logo {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  background: linear-gradient(180deg, var(--accent), var(--accent2)); color: var(--ink);
}
.tb-t { font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: -.02em; }
.tb-s { color: var(--muted); font-size: 12px; }
.tb-r { display: flex; gap: 8px; }

.wrap { max-width: 1000px; margin: 0 auto; padding: 20px 16px 60px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { padding: 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.stat .k { font-size: 13px; color: var(--muted); }
.stat .v { font-family: var(--display); font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.stat.money .v { color: var(--gold); }
.stat.attn .v { color: var(--warn); }

.tabs { margin: 22px 0 16px; max-width: 360px; }
.panel { display: none; }
.panel.active { display: block; animation: viewIn .4s var(--ease); }

.toolbar { display: grid; gap: 12px; margin-bottom: 14px; }
.count { color: var(--muted); font-size: 13px; margin: 2px 2px 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 12px; align-items: start; }

/* ---------- sales slip ---------- */
.slip { transition: transform .25s var(--ease), opacity .3s; }
.slip:hover { transform: translateY(-2px); }
.slip.in { animation: rise .55s var(--ease) both; animation-delay: var(--d, 0ms); }
.slip.leaving { animation: leave .3s var(--ease) forwards; }
.slip-top, .slip-bot { background: var(--surface); border: 1px solid var(--line); padding: 16px; }
.slip-top {
  border-radius: 18px 18px 0 0; border-bottom: 0; padding-bottom: 18px;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  -webkit-mask: radial-gradient(circle 9px at 0 100%, #0000 97%, #000) left / 51% 100% no-repeat,
                radial-gradient(circle 9px at 100% 100%, #0000 97%, #000) right / 51% 100% no-repeat;
          mask: radial-gradient(circle 9px at 0 100%, #0000 97%, #000) left / 51% 100% no-repeat,
                radial-gradient(circle 9px at 100% 100%, #0000 97%, #000) right / 51% 100% no-repeat;
}
.slip-bot {
  border-radius: 0 0 18px 18px; border-top: 1.5px dashed var(--line2); padding-top: 14px;
  -webkit-mask: radial-gradient(circle 9px at 0 0, #0000 97%, #000) left / 51% 100% no-repeat,
                radial-gradient(circle 9px at 100% 0, #0000 97%, #000) right / 51% 100% no-repeat;
          mask: radial-gradient(circle 9px at 0 0, #0000 97%, #000) left / 51% 100% no-repeat,
                radial-gradient(circle 9px at 100% 0, #0000 97%, #000) right / 51% 100% no-repeat;
}
.s-model { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: -.01em; word-break: break-word; }
.s-who { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--muted); font-size: 13.5px; }
.s-amt { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--gold); white-space: nowrap; font-variant-numeric: tabular-nums; }
.s-amt.none { color: var(--dim); font-size: 14px; font-weight: 600; }
.s-line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.s-date { margin-left: auto; color: var(--dim); font-size: 12.5px; }
.copy {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 0;
  background: rgba(255,255,255,.06); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer;
  font-variant-numeric: tabular-nums; transition: background .2s, color .2s, transform .2s var(--ease);
}
.copy:hover { background: rgba(255,255,255,.1); color: var(--text); }
.copy:active { transform: scale(.94); }

.av {
  width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center; flex: none;
  font-family: var(--display); font-weight: 700; font-size: 12px;
  background: hsl(var(--h, 150) 45% 20%); color: hsl(var(--h, 150) 80% 72%);
}
.av.lg { width: 46px; height: 46px; border-radius: 15px; font-size: 18px; }

.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; width: 100%; }
.ab {
  display: inline-flex; align-items: center; gap: 6px; padding: 9px 13px; border-radius: 12px; border: 0;
  font-size: 13px; font-weight: 600; cursor: pointer; transition: background .2s, transform .2s var(--ease);
}
.ab:active { transform: scale(.93); }
.ab.ok { background: rgba(82,230,166,.14); color: var(--accent); }
.ab.ok:hover { background: rgba(82,230,166,.25); }
.ab.bad { background: rgba(255,122,122,.12); color: var(--danger); }
.ab.bad:hover { background: rgba(255,122,122,.22); }
.ab.info { background: rgba(109,179,255,.14); color: var(--info); }
.ab.info:hover { background: rgba(109,179,255,.25); }
.ab.mute { background: rgba(255,255,255,.06); color: var(--muted); }
.ab.mute:hover { background: rgba(255,255,255,.11); color: var(--text); }
.ab.vio { background: rgba(181,156,255,.13); color: var(--violet); }
.ab.vio:hover { background: rgba(181,156,255,.24); }
.ab.del { margin-left: auto; background: rgba(255,122,122,.1); color: var(--danger); padding: 9px 11px; }

/* ---------- staff ---------- */
.staff { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.staff.in { animation: rise .55s var(--ease) both; animation-delay: var(--d, 0ms); }
.sc-main { flex: 1; min-width: 0; }
.sc-n { font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
.sc-e { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.sc-m { color: var(--dim); font-size: 12.5px; margin-top: 6px; }

.skel {
  height: 150px; border-radius: 18px;
  background: linear-gradient(90deg, rgba(255,255,255,.03), rgba(255,255,255,.08), rgba(255,255,255,.03));
  background-size: 200% 100%; animation: shimmer 1.3s infinite;
}
.empty { text-align: center; padding: 50px 20px; color: var(--muted); grid-column: 1 / -1; }
.empty svg { color: var(--dim); margin-bottom: 12px; }
.empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; font-family: var(--display); }
.empty p { font-size: 14px; }

/* ---------- sheet / dialog ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: end center; padding: 0;
  background: rgba(3,8,5,.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s;
}
.overlay.show { opacity: 1; visibility: visible; }
.sheet {
  width: min(420px, 100%); background: #0e1c15; border: 1px solid var(--line2);
  border-radius: 26px 26px 0 0; padding: 22px; text-align: center;
  padding-bottom: calc(22px + env(safe-area-inset-bottom));
  transform: translateY(50px); transition: transform .5s var(--ease);
}
.overlay.show .sheet { transform: none; }
@media (min-width: 640px) {
  .overlay { place-items: center; padding: 20px; }
  .sheet { border-radius: 26px; transform: translateY(24px) scale(.97); }
}
.sheet h4 { font-family: var(--display); font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.sheet .sub { color: var(--muted); font-size: 13.5px; margin-top: 4px; word-break: break-word; }
.sheet .btns { display: grid; gap: 10px; margin-top: 18px; }
.sheet .btns.two { grid-template-columns: 1fr 1fr; }
.q-box {
  display: grid; place-items: center; min-height: 260px; margin-top: 16px; border-radius: 18px;
  background: rgba(255,255,255,.03); border: 1px solid var(--line); overflow: hidden;
}
.q-box img { width: 100%; max-width: 280px; background: #fff; border-radius: 14px; padding: 10px; margin: 14px; animation: pop .45s var(--ease); }
.q-msg { color: var(--muted); font-size: 14px; padding: 20px; }

#toasts {
  position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  z-index: 100; display: grid; gap: 8px; width: min(420px, calc(100% - 24px)); pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-radius: 14px;
  background: #12271d; border: 1px solid var(--line2); box-shadow: 0 14px 34px -10px rgba(0,0,0,.8);
  font-size: 14px; font-weight: 500; animation: toastIn .45s var(--ease);
}
.toast.ok .ti { color: var(--accent); }
.toast.err { border-color: rgba(255,122,122,.4); }
.toast.err .ti { color: var(--danger); }
.toast.out { animation: toastOut .3s forwards; }

#splash {
  position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: var(--bg);
  transition: opacity .45s, visibility .45s;
}
#splash .logo { margin: 0; animation: pulse 1.4s ease-in-out infinite; }
#splash.gone { opacity: 0; visibility: hidden; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
@keyframes leave { to { opacity: 0; transform: translateX(34px) scale(.97); } }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes toastIn { from { opacity: 0; transform: translateY(-14px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-10px) scale(.96); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
</style>
</head>

<body>
<div class="bg"></div>
<div id="toasts"></div>

<div id="splash"><div class="logo"><span data-icon="wallet" data-size="30"></span></div></div>

<!-- ===== LOGIN ===== -->
<main id="loginView" class="auth hidden">
  <div class="auth-wrap">
    <div class="brand">
      <div class="logo"><span data-icon="shield" data-size="30"></span></div>
      <h1>Admin login</h1>
      <p>Entries approve karo aur payment mark karo.</p>
    </div>
    <div class="card">
      <form id="loginForm" novalidate>
        <div class="field"><input id="email" type="email" placeholder=" " autocomplete="username" inputmode="email"><label for="email">Admin email</label></div>
        <div class="field has-eye">
          <input id="password" type="password" placeholder=" " autocomplete="current-password"><label for="password">Password</label>
          <button type="button" class="eye" id="eyeBtn" aria-label="Password dikhao"><span data-icon="eye"></span></button>
        </div>
        <p class="msg" id="loginMsg"></p>
        <button class="btn" id="loginBtn" type="submit" style="margin-top:14px">Log in</button>
      </form>
    </div>
  </div>
</main>

<!-- ===== PANEL ===== -->
<div id="panel" class="hidden">
  <header class="topbar">
    <div class="tb-l">
      <div class="tb-logo"><span data-icon="wallet" data-size="20"></span></div>
      <div><div class="tb-t">Sales Incentive</div><div class="tb-s">Admin</div></div>
    </div>
    <div class="tb-r">
      <button class="icon-btn" id="refreshBtn" aria-label="Refresh"><span data-icon="refresh"></span></button>
      <button class="icon-btn" id="logoutBtn" aria-label="Log out"><span data-icon="logout"></span></button>
    </div>
  </header>

  <main class="wrap">
    <div class="stats">
      <div class="stat"><div class="k">Total entries</div><div class="v" id="sTotal">0</div></div>
      <div class="stat attn"><div class="k">Pending</div><div class="v" id="sPending">0</div></div>
      <div class="stat"><div class="k">Approved</div><div class="v" id="sApproved">0</div></div>
      <div class="stat"><div class="k">Paid</div><div class="v" id="sPaid">0</div></div>
      <div class="stat money"><div class="k">Total discount</div><div class="v" id="sDiscount">₹0</div></div>
      <div class="stat"><div class="k">Staff</div><div class="v" id="sStaff">0</div></div>
    </div>

    <div class="seg tabs" id="tabs" style="--n:2;--i:0">
      <span class="seg-ind"></span>
      <button data-tab="entries" class="on">Entries</button>
      <button data-tab="staff">Staff</button>
    </div>

    <section class="panel active" id="tab-entries">
      <div class="toolbar">
        <div class="search"><span data-icon="search"></span><input id="search" placeholder="Staff, model ya IMEI dhundho" autocomplete="off"></div>
        <div class="chips" id="fApprovalBox"></div>
        <div class="chips" id="fPaymentBox"></div>
      </div>
      <p class="count" id="count"></p>
      <div class="grid" id="entryList"></div>
    </section>

    <section class="panel" id="tab-staff">
      <div class="grid" id="staffList"></div>
    </section>
  </main>

// ====== SUPABASE CONFIG ======
var SUPABASE_URL = "https://wgdwpvwnhukxubbqgxnf.supabase.co";

var db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {

var sales = [];
var profiles = [];
var profileById = {};
var loaded = false;
var lastLoad = 0;
var isAdminIn = false;
var fA = "All";
var fP = "All";
var query = "";
var dlgResolve = null;

/* ---------- helpers ---------- */

function $(id) { return document.getElementById(id); }

var ICONS = {
  check: '<path d="M5 13l4 4L19 7"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',

  download: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/>',
  phone: '<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3.2-5.5 6.5-5.5s5.9 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.8c2 .7 3.2 2.5 3.5 5.2"/>'
};

function icon(n, s) {
  s = s || 18;
  return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + '</svg>';
}

function fillIcons() {
  document.querySelectorAll("[data-icon]").forEach(function (el) {
    el.innerHTML = icon(el.getAttribute("data-icon"), Number(el.getAttribute("data-size")) || 18);
  });
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, function (ch) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
  });
}

function toast(msg, type) {
  var box = $("toasts");
  var t = document.createElement("div");
  t.className = "toast " + (type || "info");
  t.innerHTML = '<span class="ti">' + icon(type === "err" ? "x" : type === "ok" ? "check" : "clock", 17) + '</span><span>' + escapeHTML(msg) + '</span>';
  box.appendChild(t);
  setTimeout(function () {
    t.classList.add("out");
    setTimeout(function () { t.remove(); }, 320);
  }, 3200);
}

function setLoading(btn, on, label) {
  if (on) {
    btn._h = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span><span>' + (label || "") + '</span>';
  } else {
    btn.disabled = false;
    if (btn._h != null) btn.innerHTML = btn._h;
  }
}

function animateNumber(el, to, fmt) {
  fmt = fmt || function (n) { return String(Math.round(n)); };
  var from = el._v || 0;
  el._v = to;
  if (from === to) { el.textContent = fmt(to); return; }
  var t0 = null, dur = 700;
  function step(ts) {
    if (t0 === null) t0 = ts;
    var p = Math.min(1, (ts - t0) / dur);
    var e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function rupee(n) { return "₹" + Math.round(n).toLocaleString("en-IN"); }

function fmtDate(v) {
  var s = String(v || "");
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (m) return m[3] + "/" + m[2] + "/" + m[1];
  return new Date(v).toLocaleDateString("en-IN");
}

function hue(s) {
  var h = 0;
  s = String(s || "");
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return h;
}

function initial(name) {
  var s = String(name || "?").trim();
  return (s.charAt(0) || "?").toUpperCase();
}

function slug(s) {
  return String(s || "staff").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "staff";
}

function fail(id, msg) {
  toast(msg, "err");
  var el = $(id);
  var f = el.closest(".field") || el;
  f.classList.remove("shake");
  void f.offsetWidth;
  f.classList.add("shake");
  el.focus();
}

/* ---------- AUTH ---------- */

function showLogin(msg) {
  isAdminIn = false;
  $("panel").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  $("loginMsg").textContent = msg || "";
  $("loginMsg").className = "msg" + (msg ? " err" : "");
}

// Login ke baad check karo ki ye account admin hai ya nahi
async function enterIfAdmin() {
  var r = await db.rpc("is_admin");

  if (r.error || r.data !== true) {
    await db.auth.signOut();
    showLogin(r.error ? "Admin check nahi hua: " + r.error.message : "Ye account admin nahi hai.");
    return false;
  }

  isAdminIn = true;
  $("loginView").classList.add("hidden");
  $("panel").classList.remove("hidden");
  await loadAll(true);
  return true;
}

async function login() {
  var email = $("email").value.trim();
  var password = $("password").value;
  var btn = $("loginBtn");

  if (!email) { fail("email", "Email likho."); return; }
  if (!password) { fail("password", "Password likho."); return; }

  setLoading(btn, true, "Log in ho raha hai");
  $("loginMsg").textContent = "";

  var r = await db.auth.signInWithPassword({ email: email, password: password });

  if (r.error) {
    setLoading(btn, false);
    $("loginMsg").textContent = "Log in nahi hua: " + r.error.message;
    $("loginMsg").className = "msg err";
    return;
  }

  $("password").value = "";
  await enterIfAdmin();
  setLoading(btn, false);
}

async function logout() {
  await db.auth.signOut();
  sales = []; profiles = []; profileById = {}; loaded = false;
  showLogin("");
}

/* ---------- DATA ---------- */

async function loadAll(animate, silent) {
  var btn = $("refreshBtn");
  if (!silent) btn.classList.add("spinning");

  var res = await Promise.all([
    db.from("profiles").select("id,email,full_name,qr_path,created_at").order("full_name"),
    db.from("sales").select("*").order("created_at", { ascending: false }).limit(1000)
  ]);
  var pr = res[0], sr = res[1];

  btn.classList.remove("spinning");
  loaded = true;
  lastLoad = Date.now();

  if (pr.error) {
    toast("Staff load nahi hue: " + pr.error.message, "err");
  } else {
    profiles = pr.data || [];
    profileById = {};
    profiles.forEach(function (p) { profileById[p.id] = p; });
  }

  if (sr.error) {
    toast("Entries load nahi hui: " + sr.error.message, "err");
    return;
  }

  sales = sr.data || [];
  renderAll(animate !== false);
}

// Pehle screen par badlav, phir database; fail hua to wapas purana
function patchEntry(id, fields, okMsg) {
  var it = sales.find(function (x) { return x.id === id; });
  if (!it) return;
  var prev = {};
  Object.keys(fields).forEach(function (k) { prev[k] = it[k]; });
  Object.assign(it, fields);
  renderAll(false);

  db.from("sales").update(fields).eq("id", id).select().then(function (r) {
    if (r.error || !r.data || !r.data.length) {
      Object.assign(it, prev);
      renderAll(false);
      toast(r.error ? "Update nahi hua: " + r.error.message : "Update ki permission nahi mili.", "err");
    } else {
      toast(okMsg || "Update ho gaya", "ok");
    }
  });
}

async function deleteEntry(id) {
  var ok = await confirmDialog("Entry delete karein?", "Ye entry hamesha ke liye hat jayegi.", "Delete");
  if (!ok) return;

  var el = document.querySelector('.slip[data-id="' + id + '"]');
  if (el) el.classList.add("leaving");

  var r = await db.from("sales").delete().eq("id", id).select();

  if (r.error || !r.data || !r.data.length) {
    if (el) el.classList.remove("leaving");
    toast(r.error ? "Delete nahi hua: " + r.error.message : "Delete ki permission nahi mili.", "err");
    return;
  }

  setTimeout(function () {
    sales = sales.filter(function (x) { return x.id !== id; });
    renderAll(false);
  }, 280);
  toast("Entry delete ho gayi", "ok");
}

/* ---------- RENDER ---------- */

function staffName(it) {
  var p = it.user_id ? profileById[it.user_id] : null;
  return p ? p.full_name : it.staff;
}

function fmtDiscount(v) {
  var s = String(v).trim();
  var n = Number(s);
  if (s !== "" && isFinite(n)) return '<div class="s-amt">' + rupee(n) + '</div>';
  if (/^no$/i.test(s)) return '<div class="s-amt none">No discount</div>';
  return '<div class="s-amt none">' + escapeHTML(s) + '</div>';
}

function renderStats() {
  var total = sales.reduce(function (s, x) {
    var n = Number(x.discount);
    return s + (isFinite(n) ? n : 0);
  }, 0);
  animateNumber($("sTotal"), sales.length);
  animateNumber($("sPending"), sales.filter(function (x) { return x.approval === "Pending"; }).length);
  animateNumber($("sApproved"), sales.filter(function (x) { return x.approval === "Approved"; }).length);
  animateNumber($("sPaid"), sales.filter(function (x) { return x.payment === "Paid"; }).length);
  animateNumber($("sDiscount"), total, rupee);
  animateNumber($("sStaff"), profiles.length);
}

function renderFilters() {
  var ao = ["All", "Pending", "Approved", "Rejected"];
  $("fApprovalBox").innerHTML = ao.map(function (o) {
    var n = o === "All" ? sales.length : sales.filter(function (x) { return x.approval === o; }).length;
    return '<button class="fchip' + (fA === o ? ' on' : '') + '" data-fa="' + o + '">' + o + '<i>' + n + '</i></button>';
  }).join("");

  var po = ["All", "Unpaid", "Paid"];
  $("fPaymentBox").innerHTML = po.map(function (o) {
    var n = o === "All" ? sales.length : sales.filter(function (x) { return x.payment === o; }).length;
    var label = o === "All" ? "Any payment" : o;
    return '<button class="fchip' + (fP === o ? ' on' : '') + '" data-fp="' + o + '">' + label + '<i>' + n + '</i></button>';
  }).join("");
}

function slip(it, i, animate) {
  var ap = it.approval;
  var apc = ap === "Approved" ? "c-ok" : ap === "Rejected" ? "c-bad" : "c-warn";
  var api = ap === "Approved" ? "check" : ap === "Rejected" ? "x" : "clock";
  var paid = it.payment === "Paid";
  var name = staffName(it);
  var hasProfile = !!(it.user_id && profileById[it.user_id]);

  var acts = "";
  if (ap !== "Approved") acts += '<button class="ab ok" data-act="approve">' + icon("check", 15) + 'Approve</button>';
  if (ap !== "Rejected") acts += '<button class="ab bad" data-act="reject">' + icon("x", 15) + 'Reject</button>';
  if (ap !== "Pending") acts += '<button class="ab mute" data-act="pending">' + icon("undo", 15) + 'Pending</button>';
  acts += paid
    ? '<button class="ab mute" data-act="unpaid">' + icon("undo", 15) + 'Mark unpaid</button>'
    : '<button class="ab info" data-act="paid">' + icon("wallet", 15) + 'Mark paid</button>';
  if (hasProfile) acts += '<button class="ab vio" data-act="qr">' + icon("qr", 15) + 'QR</button>';
  acts += '<button class="ab del" data-act="del" aria-label="Delete">' + icon("trash", 16) + '</button>';

  return '<article class="slip' + (animate ? ' in' : '') + '" data-id="' + it.id + '" data-uid="' + escapeHTML(it.user_id || "") + '" style="--d:' + (Math.min(i, 8) * 55) + 'ms">' +
    '<div class="slip-top">' +
      '<div>' +
        '<div class="s-model">' + escapeHTML(it.model) + '</div>' +
        '<div class="s-who"><span class="av" style="--h:' + hue(name) + '">' + escapeHTML(initial(name)) + '</span>' + escapeHTML(name) + '</div>' +
      '</div>' +
      fmtDiscount(it.discount) +
    '</div>' +
    '<div class="slip-bot">' +
      '<div class="s-line">' +
        '<button class="copy" data-act="copy" data-v="' + escapeHTML(it.imei) + '">' + icon("copy", 13) + escapeHTML(it.imei) + '</button>' +
        '<span class="chip ' + apc + '">' + icon(api, 13) + escapeHTML(ap) + '</span>' +
        '<span class="chip ' + (paid ? 'c-ok' : 'c-mute') + '">' + icon("wallet", 13) + escapeHTML(it.payment) + '</span>' +
        '<span class="chip c-mute">' + escapeHTML(it.status) + '</span>' +
        '<span class="s-date">' + escapeHTML(fmtDate(it.sale_date || it.created_at)) + '</span>' +
      '</div>' +
      '<div class="acts">' + acts + '</div>' +
    '</div>' +
  '</article>';
}

function renderEntries(animate) {
  var box = $("entryList");

  if (!loaded) {
    box.innerHTML = '<div class="skel"></div><div class="skel"></div>';
    $("count").textContent = "";
    return;
  }

  var q = query.toLowerCase();
  var list = sales.filter(function (x) {
    var hay = !q || [staffName(x), x.model, x.imei].some(function (v) {
      return String(v).toLowerCase().indexOf(q) !== -1;
    });
    return hay && (fA === "All" || x.approval === fA) && (fP === "All" || x.payment === fP);
  });

  $("count").textContent = list.length + (list.length === 1 ? " entry" : " entries");

  if (!list.length) {
    box.innerHTML = '<div class="empty">' + icon("phone", 40) +
      '<b>' + (sales.length ? "Koi entry nahi mili" : "Abhi koi entry nahi") + '</b>' +
      '<p>' + (sales.length ? "Search ya filter badal kar dekho." : "Staff ki entries yahan dikhengi.") + '</p></div>';
    return;
  }

  box.innerHTML = list.map(function (x, i) { return slip(x, i, animate); }).join("");
}

function renderStaff(animate) {
  var box = $("staffList");

  if (!loaded) { box.innerHTML = '<div class="skel"></div>'; return; }

  if (!profiles.length) {
    box.innerHTML = '<div class="empty">' + icon("users", 40) + '<b>Abhi koi staff nahi</b><p>Staff register karenge to yahan dikhenge.</p></div>';
    return;
  }

  box.innerHTML = profiles.map(function (p, i) {
    var mine = sales.filter(function (x) { return x.user_id === p.id; });
    var appr = mine.filter(function (x) { return x.approval === "Approved"; }).length;
    var pend = mine.filter(function (x) { return x.approval === "Pending"; }).length;
    return '<div class="staff' + (animate ? ' in' : '') + '" data-uid="' + p.id + '" style="--d:' + (Math.min(i, 8) * 55) + 'ms">' +
      '<span class="av lg" style="--h:' + hue(p.full_name) + '">' + escapeHTML(initial(p.full_name)) + '</span>' +
      '<div class="sc-main">' +
        '<div class="sc-n">' + escapeHTML(p.full_name) + '</div>' +
        '<div class="sc-e">' + escapeHTML(p.email || "") + '</div>' +
        '<div class="sc-m">' + mine.length + ' entries • ' + appr + ' approved • ' + pend + ' pending</div>' +
      '</div>' +
      (p.qr_path
        ? '<button class="ab vio" data-act="sqr">' + icon("qr", 15) + 'QR</button>'
        : '<span class="chip c-warn">QR nahi</span>') +
    '</div>';
  }).join("");
}

function renderAll(animate) {
  renderStats();
  renderFilters();
  renderEntries(animate);
  renderStaff(animate);
}

/* ---------- QR SHEET ---------- */

async function showQR(userId) {
  var p = profileById[userId];
  if (!p) return;

  $("qName").textContent = p.full_name;
  $("qEmail").textContent = p.email || "";
  $("qImg").classList.add("hidden");
  $("qImg").removeAttribute("src");
  $("qDl").classList.add("hidden");
  $("qMsg").classList.remove("hidden");
  $("qMsg").textContent = "Load ho raha hai...";
  $("qrSheet").classList.add("show");

  if (!p.qr_path) {
    $("qMsg").textContent = "Is staff ne abhi QR save nahi kiya.";
    return;
  }

  var r = await db.from("profiles").select("qr_data").eq("id", userId).maybeSingle();

  if (r.error || !r.data || !r.data.qr_data) {
    $("qMsg").textContent = r.error ? "QR load nahi hua: " + r.error.message : "Is staff ne abhi QR save nahi kiya.";
    return;
  }

  var data = r.data.qr_data;
  $("qMsg").classList.add("hidden");
  $("qImg").src = data;
  $("qImg").classList.remove("hidden");
  var dl = $("qDl");
  dl.href = data;
  dl.download = "qr-" + slug(p.full_name) + (data.indexOf("image/jpeg") > -1 ? ".jpg" : ".png");
  dl.classList.remove("hidden");
}

function closeQR() { $("qrSheet").classList.remove("show"); }

/* ---------- CONFIRM DIALOG ---------- */

function confirmDialog(title, text, okLabel) {
  $("dlgT").textContent = title;
  $("dlgM").textContent = text;
  $("dlgOk").textContent = okLabel || "Yes";
  $("dlg").classList.add("show");
  return new Promise(function (res) { dlgResolve = res; });
}

function closeDlg(v) {
  $("dlg").classList.remove("show");
  if (dlgResolve) {
    var r = dlgResolve;
    dlgResolve = null;
    r(v);
  }
}

/* ---------- COPY ---------- */

function copyText(text) {
  function done() { toast("IMEI copy ho gaya", "ok"); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
  } else {
    fallbackCopy(text);
    done();
  }
}

function fallbackCopy(text) {
  var t = document.createElement("textarea");
  t.value = text;
  t.style.position = "fixed";
  t.style.opacity = "0";
  document.body.appendChild(t);
  t.select();
  try { document.execCommand("copy"); } catch (e) {}
  t.remove();
}

/* ---------- EVENTS ---------- */

function bindEvents() {
  $("loginForm").addEventListener("submit", function (e) { e.preventDefault(); login(); });
  $("eyeBtn").addEventListener("click", function () {
    var p = $("password");
    var show = p.type === "password";
    p.type = show ? "text" : "password";
    this.innerHTML = icon(show ? "eyeoff" : "eye");
  });
  $("logoutBtn").addEventListener("click", logout);
  $("refreshBtn").addEventListener("click", function () { loadAll(true); });

  // tabs
  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-tab]");
    if (!b) return;
    var t = b.getAttribute("data-tab");
    this.style.setProperty("--i", t === "entries" ? 0 : 1);
    this.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
    $("tab-entries").classList.toggle("active", t === "entries");
    $("tab-staff").classList.toggle("active", t === "staff");
  });

  // search + filters
  $("search").addEventListener("input", function () {
    query = this.value.trim();
    renderEntries(false);
  });
  $("fApprovalBox").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-fa]");
    if (!b) return;
    fA = b.getAttribute("data-fa");
    renderFilters();
    renderEntries(false);
  });
  $("fPaymentBox").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-fp]");
    if (!b) return;
    fP = b.getAttribute("data-fp");
    renderFilters();
    renderEntries(false);
  });

  // entry actions
  $("entryList").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b) return;
    var card = b.closest(".slip");
    if (!card) return;
    var id = Number(card.getAttribute("data-id"));
    var act = b.getAttribute("data-act");

    if (act === "approve") patchEntry(id, { approval: "Approved" }, "Entry approve ho gayi");
    else if (act === "reject") patchEntry(id, { approval: "Rejected" }, "Entry reject ho gayi");
    else if (act === "pending") patchEntry(id, { approval: "Pending" }, "Entry pending mein wapas");
    else if (act === "paid") patchEntry(id, { payment: "Paid" }, "Paid mark ho gaya");
    else if (act === "unpaid") patchEntry(id, { payment: "Unpaid" }, "Unpaid mark ho gaya");
    else if (act === "qr") showQR(card.getAttribute("data-uid"));
    else if (act === "copy") copyText(b.getAttribute("data-v"));
    else if (act === "del") deleteEntry(id);
  });

  // staff list
  $("staffList").addEventListener("click", function (e) {
    var b = e.target.closest('[data-act="sqr"]');
    if (!b) return;
    var row = b.closest(".staff");
    if (row) showQR(row.getAttribute("data-uid"));
  });

  // sheet + dialog
  $("qClose").addEventListener("click", closeQR);
  $("qrSheet").addEventListener("click", function (e) { if (e.target === this) closeQR(); });
  $("dlgNo").addEventListener("click", function () { closeDlg(false); });
  $("dlgOk").addEventListener("click", function () { closeDlg(true); });
  $("dlg").addEventListener("click", function (e) { if (e.target === this) closeDlg(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if ($("dlg").classList.contains("show")) closeDlg(false);
      else closeQR();
    }
  });

  // tab wapas khulne par chup-chaap refresh
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && isAdminIn && Date.now() - lastLoad > 20000) loadAll(false, true);
  });
}

/* ---------- INIT ---------- */

fillIcons();
bindEvents();

db.auth.getSession().then(function (r) {
  if (r.data && r.data.session) return enterIfAdmin();
  showLogin("");
}).catch(function () {
  showLogin("");
}).then(function () {
  $("splash").classList.add("gone");
});
</script>
